<div class="d-flex flex-column justify-content-center align-items-center h-600">
  <div>
    <!-- Player -->
    <app-audio-player [upload]="currentlyPlaying()"></app-audio-player>
  </div>
  <div>
    <!-- Playlist list -->
    <h2>Playlist</h2>
    <ul>
      @for(upload of playlist(); track $index) {
        <li>
          @if(upload.isChosen) {
            <span>Is Chosen</span>
          } @else {
            <button class="btn btn-primary btn-outline-dark" (click)="choose(upload)">Play</button>
          }
          <span> | </span>
          <span>{{upload.filename}}</span>
          <span> | </span>
          <button class="btn btn-dark btn-outline-dark btn-text-white" (click)="removeFromPlaylist(upload)">Delete</button>
        </li>
      }
    </ul>
  </div>
  <div>
    <input type="file" (change)="uploadFiles($event)" accept="audio/*" multiple/>
  </div>

</div>
