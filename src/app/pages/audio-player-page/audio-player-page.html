<div class="d-flex flex-column justify-content-center align-items-center">
  <div>
    <!-- Player -->
    <app-audio-player [upload]="currentlyPlaying()"></app-audio-player>
  </div>
  <div class="w-50">
    <!-- Playlist list -->
    <h2>Playlist</h2>

    <div class="container">
      @for(upload of playlist(); track $index) {
        <div class="row" [ngClass]="{
          'bg-secondary': upload.isChosen
        }">
          <div class="col"> {{upload.filename}}</div>
          <div class="col-2">
            @if(!upload.isChosen) {
              <button class="btn btn-primary btn-outline-dark float-end" (click)="choose(upload)">Play</button>
            }
          </div>
          <div class="col-2">
            <button class="btn btn-dark btn-outline-dark btn-text-white float-end" (click)="removeFromPlaylist(upload)">Delete</button>
          </div>
        </div>
      }
    </div>
  </div>
  <div>
    <input type="file" (change)="uploadFiles($event)" accept="audio/*" multiple/>
  </div>

</div>
