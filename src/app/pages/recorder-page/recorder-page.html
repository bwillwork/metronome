<div class="d-flex flex-column justify-content-center align-items-center h-600">
  <div>
    <canvas #visualizer class="visualizer" height="50px"></canvas>
  </div>
  <div>
    <button class="btn" [ngClass]="{
      'btn-primary': !recording(),
      'btn-dark': recording(),
      }" (click)="((recording()) ? stop() : record())">{{(recording()) ? 'Stop' : 'Record'}}</button>
  </div>
</div>

<app-recording-modal></app-recording-modal>
