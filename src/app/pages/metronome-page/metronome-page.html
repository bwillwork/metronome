<div class="d-flex flex-column justify-content-center align-items-center h-600">
  <div>
    <app-metronome-display></app-metronome-display>
  </div>
  <div class="d-flex flex-column justify-content-center align-items-center">
    <div>
      <button class="btn" [ngClass]="{
      'btn-primary': !running(),
      'btn-dark': running(),
      }" (click)="((running()) ? stop() : start())">{{(running()) ? 'Stop' : 'Start'}}</button>

    </div>
    <div>
      <label>Beats Per Min: </label>
      <button class="btn" (click)="minus()">Minus</button>
      <input type="range" [value]="config().beatsPerMinute" (change)="rangeChange($event)" [min]="minBPMinute" [max]="maxBPMinute"/>
      <button class="btn" (click)="plus()">Plus</button>
    </div>
    <div>
      <label>Beats Per Measure: </label>
      <input type="number" [value]="config().signature.beatsPerMeasure" (change)="updateBeatsPerMeasure($event)" [min]="minBPMeasure" [max]="maxBPMeasure"/>
    </div>
  </div>
</div>
