<div class="d-flex flex-column justify-content-center align-items-center h-600">
  <div>
    <app-metronome-display></app-metronome-display>
  </div>
  <div class="d-flex flex-column justify-content-center align-items-center">
    <div>
      <button class="btn btn-outline-dark" [ngClass]="{
      'btn-primary': !running(),
      'btn-dark': running(),
      }" (click)="((running()) ? stop() : start())">{{(running()) ? 'Stop' : 'Start'}}</button>

    </div>
    <div>
      <app-custom-slider [value]="config().beatsPerMinute" [min]="minBPMinute" [max]="maxBPMinute" (valueChange)="newRangeChange($event)"></app-custom-slider>
    </div>
    <div>
      <label>Beats Per Measure</label>
      <input class="form-control" type="number" [value]="config().signature.beatsPerMeasure" (change)="updateBeatsPerMeasure($event)" [min]="minBPMeasure" [max]="maxBPMeasure"/>
    </div>
  </div>
</div>
