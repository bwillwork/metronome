@if(hasUpload()) {
<div>
  <p>Title: {{upload()?.filename ?? ''}}</p>
  <audio
    #audioPlayer
    [src]="upload()?.audioURL ?? ''"
    (play)="play($event)"
    (playing)="playing($event)"
    (pause)="pause($event)"
    (ended)="ended($event)"
    (volumechange)="volumechange($event)"
    (change)="change($event)"
    (loadeddata)="loaded($event)"
    controls></audio>
</div>
} @else {
  <p>Nothing to play</p>
}
